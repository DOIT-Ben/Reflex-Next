[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-history-sqlite"
version = "0.1.0"
description = "Encrypted SQLite history storage plugin for Reflex Next."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=48.0.1,<49",
  "reflex-core",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.entry-points."reflex.storage"]
history-sqlite = "reflex_history_sqlite:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../packages/reflex-core/src"]

[tool.uv.sources]
reflex-core = { path = "../../packages/reflex-core", editable = true }
