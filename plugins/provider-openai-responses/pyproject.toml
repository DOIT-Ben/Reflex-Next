[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-provider-openai-responses"
version = "0.1.0"
description = "OpenAI Responses API provider adapter for Reflex Next."
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "reflex-core"]

[project.optional-dependencies]
dev = ["pytest"]

[project.entry-points."reflex.providers"]
openai-responses = "reflex_provider_openai_responses:openai_responses"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../packages/reflex-core/src"]

[tool.uv.sources]
reflex-core = { path = "../../packages/reflex-core", editable = true }
