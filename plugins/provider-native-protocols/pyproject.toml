[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-provider-native-protocols"
version = "0.1.0"
description = "Anthropic Messages and Gemini GenerateContent providers for Reflex Next."
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "reflex-core"]

[project.optional-dependencies]
dev = ["pytest"]

[project.entry-points."reflex.providers"]
anthropic = "reflex_provider_native_protocols:anthropic"
gemini = "reflex_provider_native_protocols:gemini"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../packages/reflex-core/src"]

[tool.uv.sources]
reflex-core = { path = "../../packages/reflex-core", editable = true }
