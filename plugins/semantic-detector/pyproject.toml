[project]
name = "reflex-plugin-semantic-detector"
version = "0.1.0"
description = "Optional semantic scene detector plugin for Reflex Next."
requires-python = ">=3.11"
dependencies = [
  "reflex-core",
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=3,<6",
]
dev = ["pytest"]

[project.entry-points."reflex.scene_detectors"]
semantic-detector = "reflex_semantic_detector:plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../packages/reflex-core/src"]

[tool.uv.sources]
reflex-core = { path = "../../packages/reflex-core", editable = true }
