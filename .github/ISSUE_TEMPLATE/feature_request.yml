name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先阅读 [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) 的架构边界：
        说明该能力属于 Core、插件还是桌面宿主，会大大加快评估。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述你遇到的具体场景和痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
