name: Backend Verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_heavy:
        description: "Run release-grade Windows lifecycle contract, soak smoke, dependency and SBOM gates"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Locked backend verification
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      UV_FROZEN: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.13"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/tauri-host/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned Cargo tools
        id: cargo-tools-cache
        if: ${{ inputs.run_heavy == true }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-audit.exe
            ~/.cargo/bin/cargo-license.exe
            ~/.cargo/bin/cargo-cyclonedx.exe
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-tools-windows-audit-0.22.2-license-0.6.1-cyclonedx-0.5.9

      - name: Install pinned dependency audit tools
        if: ${{ inputs.run_heavy == true && steps.cargo-tools-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-license --version 0.6.1 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked --jobs 2

      - name: Verify pinned Cargo tool versions
        if: ${{ inputs.run_heavy == true }}
        shell: pwsh
        run: |
          $installed = (cargo install --list) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $installed -notmatch "(?m)^cargo-audit v0\.22\.2:$") { throw "cargo-audit version mismatch" }
          if ($installed -notmatch "(?m)^cargo-license v0\.6\.1:$") { throw "cargo-license version mismatch" }
          if ($installed -notmatch "(?m)^cargo-cyclonedx v0\.5\.9:$") { throw "cargo-cyclonedx version mismatch" }

      - name: Verify backend script contract
        shell: pwsh
        run: .\tools\tests\verify_backend_contract.ps1

      - name: Verify Windows lifecycle tool contract
        shell: pwsh
        run: .\tools\tests\verify_windows_lifecycle_contract.ps1

      - name: Run locked backend verification
        shell: pwsh
        run: |
          $verifyArgs = @{}
          if ("${{ inputs.run_heavy }}" -ne "true") {
            $verifyArgs += @{
              SkipHeavy = $true
              SkipDependencyAudit = $true
              SkipReleaseMaterials = $true
            }
          }
          & .\tools\verify_backend.ps1 @verifyArgs

      - name: Verify Reflex Cloud operations contract
        shell: pwsh
        run: .\tools\verify_cloud.ps1 -SkipDocker -SkipTests

      - name: Build frontend release artifact for retained SBOM
        if: ${{ inputs.run_heavy == true }}
        shell: pwsh
        run: npm --prefix .\apps\tauri-host run build

      - name: Generate retained SBOM and scan build artifacts
        if: ${{ inputs.run_heavy == true }}
        shell: pwsh
        run: |
          .\tools\generate_release_sbom.ps1 `
            -OutputDirectory "${{ runner.temp }}\reflex-sbom" `
            -ReleasePath ".\apps\tauri-host\dist"

      - name: Upload SBOM evidence
        if: ${{ inputs.run_heavy == true }}
        uses: actions/upload-artifact@v7
        with:
          name: reflex-next-sbom-${{ github.sha }}
          path: ${{ runner.temp }}\reflex-sbom
          if-no-files-found: error
          retention-days: 30
