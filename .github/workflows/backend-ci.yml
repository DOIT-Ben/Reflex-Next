name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "apps/tauri-host/**"
      - "packages/**"
      - "plugins/**"
      - "template-packs/**"
      - "tools/verify_backend.ps1"
      - "tools/tests/verify_backend_contract.ps1"
      - "tools/scan_release_secrets.ps1"
      - "tools/tests/scan_release_secrets_contract.ps1"
      - "tools/audit_dependencies.ps1"
      - "tools/tests/audit_dependencies_contract.ps1"
      - "tools/policies/dependency-audit-policy.json"
      - "tools/generate_release_sbom.ps1"
      - "tools/tests/generate_release_sbom_contract.ps1"
      - "tools/provider_smoke.py"
      - "tools/tests/test_provider_smoke.py"
      - "tools/tests/fixtures/provider_smoke_*.py"
      - "tools/benchmark_backend.py"
      - "tools/tests/test_benchmark_backend.py"
      - "tools/benchmark_history_sqlite.py"
      - "tools/tests/test_benchmark_history_sqlite.py"
      - "tools/soak_backend.py"
      - "tools/tests/test_soak_backend.py"
      - "tools/verify_cloud.ps1"
      - "tools/reflex-cloud-backup.ps1"
      - "tools/reflex-cloud-restore.ps1"
      - "tools/reflex-cloud-budget-check.ps1"
      - "tools/tests/reflex_cloud_ops_contract.ps1"
      - "services/reflex-cloud/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/backend-ci.yml"
      - "apps/tauri-host/**"
      - "packages/**"
      - "plugins/**"
      - "template-packs/**"
      - "tools/verify_backend.ps1"
      - "tools/tests/verify_backend_contract.ps1"
      - "tools/scan_release_secrets.ps1"
      - "tools/tests/scan_release_secrets_contract.ps1"
      - "tools/audit_dependencies.ps1"
      - "tools/tests/audit_dependencies_contract.ps1"
      - "tools/policies/dependency-audit-policy.json"
      - "tools/generate_release_sbom.ps1"
      - "tools/tests/generate_release_sbom_contract.ps1"
      - "tools/provider_smoke.py"
      - "tools/tests/test_provider_smoke.py"
      - "tools/tests/fixtures/provider_smoke_*.py"
      - "tools/benchmark_backend.py"
      - "tools/tests/test_benchmark_backend.py"
      - "tools/benchmark_history_sqlite.py"
      - "tools/tests/test_benchmark_history_sqlite.py"
      - "tools/soak_backend.py"
      - "tools/tests/test_soak_backend.py"
      - "tools/verify_cloud.ps1"
      - "tools/reflex-cloud-backup.ps1"
      - "tools/reflex-cloud-restore.ps1"
      - "tools/reflex-cloud-budget-check.ps1"
      - "tools/tests/reflex_cloud_ops_contract.ps1"
      - "services/reflex-cloud/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Locked backend verification
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      UV_FROZEN: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.13"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/tauri-host/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned Cargo tools
        id: cargo-tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit.exe
            ~/.cargo/bin/cargo-license.exe
            ~/.cargo/bin/cargo-cyclonedx.exe
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-tools-windows-audit-0.22.2-license-0.6.1-cyclonedx-0.5.9

      - name: Install pinned dependency audit tools
        if: steps.cargo-tools-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-license --version 0.6.1 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked --jobs 2

      - name: Verify pinned Cargo tool versions
        shell: powershell
        run: |
          $installed = (cargo install --list) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $installed -notmatch "(?m)^cargo-audit v0\.22\.2:$") { throw "cargo-audit version mismatch" }
          if ($installed -notmatch "(?m)^cargo-license v0\.6\.1:$") { throw "cargo-license version mismatch" }
          if ($installed -notmatch "(?m)^cargo-cyclonedx v0\.5\.9:$") { throw "cargo-cyclonedx version mismatch" }

      - name: Verify backend script contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\tests\verify_backend_contract.ps1

      - name: Run locked backend verification
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\verify_backend.ps1

      - name: Verify Reflex Cloud service and operations contracts
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\verify_cloud.ps1 -SkipDocker

      - name: Generate retained SBOM and scan build artifacts
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\generate_release_sbom.ps1 `
            -OutputDirectory "${{ runner.temp }}\reflex-sbom" `
            -ReleasePath ".\apps\tauri-host\dist"

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: reflex-next-sbom-${{ github.sha }}
          path: ${{ runner.temp }}\reflex-sbom
          if-no-files-found: error
          retention-days: 30
