name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "apps/tauri-host/**"
      - "packages/**"
      - "plugins/**"
      - "template-packs/**"
      - "tools/verify_backend.ps1"
      - "tools/tests/verify_backend_contract.ps1"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/backend-ci.yml"
      - "apps/tauri-host/**"
      - "packages/**"
      - "plugins/**"
      - "template-packs/**"
      - "tools/verify_backend.ps1"
      - "tools/tests/verify_backend_contract.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Locked backend verification
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      UV_FROZEN: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.13"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/tauri-host/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify backend script contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\tests\verify_backend_contract.ps1

      - name: Run locked backend verification
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\verify_backend.ps1
