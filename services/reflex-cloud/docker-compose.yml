services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reflex_cloud
      POSTGRES_USER: reflex_cloud
      POSTGRES_PASSWORD: ${REFLEX_POSTGRES_PASSWORD:?set REFLEX_POSTGRES_PASSWORD}
    volumes:
      - reflex-cloud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflex_cloud -d reflex_cloud"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${REFLEX_CLOUD_IMAGE:-reflex-cloud:latest}
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        reflex_core: ../../packages/reflex-core
        provider_minimax: ../../plugins/provider-minimax
        template_pack: ../../template-packs/builtin
    restart: unless-stopped
    environment:
      REFLEX_CLOUD_ENVIRONMENT: production
      REFLEX_CLOUD_DATABASE_URL: postgresql+psycopg://reflex_cloud:${REFLEX_POSTGRES_PASSWORD}@postgres:5432/reflex_cloud
      REFLEX_CLOUD_UPLOAD_DIRECTORY: /app/data/uploads
      REFLEX_CLOUD_ADMIN_TOKEN: ${REFLEX_CLOUD_ADMIN_TOKEN:?set REFLEX_CLOUD_ADMIN_TOKEN}
      REFLEX_CLOUD_TOKEN_PEPPER: ${REFLEX_CLOUD_TOKEN_PEPPER:?set REFLEX_CLOUD_TOKEN_PEPPER}
      REFLEX_CLOUD_PRIVACY_POLICY_VERSION: ${REFLEX_CLOUD_PRIVACY_POLICY_VERSION:-2026-07-14}
      REFLEX_CLOUD_RETENTION_DAYS: 90
      REFLEX_CLOUD_INSTALLATION_LIMIT_PER_IP_PER_HOUR: ${REFLEX_CLOUD_INSTALLATION_LIMIT_PER_IP_PER_HOUR:-20}
      REFLEX_CLOUD_FEEDBACK_LIMIT_PER_IP_PER_HOUR: ${REFLEX_CLOUD_FEEDBACK_LIMIT_PER_IP_PER_HOUR:-30}
      REFLEX_CLOUD_FEEDBACK_ATTACHMENT_BYTES_PER_IP_PER_DAY: ${REFLEX_CLOUD_FEEDBACK_ATTACHMENT_BYTES_PER_IP_PER_DAY:-10485760}
      REFLEX_CLOUD_GLOBAL_DAILY_FEEDBACK_LIMIT: ${REFLEX_CLOUD_GLOBAL_DAILY_FEEDBACK_LIMIT:-10000}
      REFLEX_CLOUD_GLOBAL_DAILY_FEEDBACK_ATTACHMENT_BYTES: ${REFLEX_CLOUD_GLOBAL_DAILY_FEEDBACK_ATTACHMENT_BYTES:-1073741824}
      REFLEX_CLOUD_FEEDBACK_ATTACHMENT_MIN_FREE_BYTES: ${REFLEX_CLOUD_FEEDBACK_ATTACHMENT_MIN_FREE_BYTES:-536870912}
      REFLEX_CLOUD_TRUSTED_PROXY_CIDRS: ${REFLEX_CLOUD_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      REFLEX_CLOUD_PROVIDER_API_KEY: ${REFLEX_CLOUD_PROVIDER_API_KEY:?set REFLEX_CLOUD_PROVIDER_API_KEY}
      REFLEX_CLOUD_PROVIDER_BASE_URL: ${REFLEX_CLOUD_PROVIDER_BASE_URL:-https://api.minimaxi.com/v1/chat/completions}
      REFLEX_CLOUD_PROVIDER_ALLOWED_HOSTS: ${REFLEX_CLOUD_PROVIDER_ALLOWED_HOSTS:-api.minimaxi.com}
      REFLEX_CLOUD_PROVIDER_MODEL: ${REFLEX_CLOUD_PROVIDER_MODEL:-MiniMax-M2.7-highspeed}
      REFLEX_CLOUD_PROVIDER_PRICING_VERSION: ${REFLEX_CLOUD_PROVIDER_PRICING_VERSION:?set REFLEX_CLOUD_PROVIDER_PRICING_VERSION}
      REFLEX_CLOUD_PROVIDER_INPUT_USD_PER_MILLION_TOKENS: ${REFLEX_CLOUD_PROVIDER_INPUT_USD_PER_MILLION_TOKENS:?set REFLEX_CLOUD_PROVIDER_INPUT_USD_PER_MILLION_TOKENS}
      REFLEX_CLOUD_PROVIDER_OUTPUT_USD_PER_MILLION_TOKENS: ${REFLEX_CLOUD_PROVIDER_OUTPUT_USD_PER_MILLION_TOKENS:?set REFLEX_CLOUD_PROVIDER_OUTPUT_USD_PER_MILLION_TOKENS}
      REFLEX_CLOUD_PROVIDER_ESTIMATED_CHARS_PER_TOKEN: ${REFLEX_CLOUD_PROVIDER_ESTIMATED_CHARS_PER_TOKEN:-2}
      REFLEX_CLOUD_TEMPLATE_PACK_DIRECTORY: /app/template-packs/builtin
      REFLEX_CLOUD_MAX_CONCURRENT_GLOBAL: ${REFLEX_CLOUD_MAX_CONCURRENT_GLOBAL:-32}
      REFLEX_CLOUD_MAX_CONCURRENT_PER_INSTALLATION: ${REFLEX_CLOUD_MAX_CONCURRENT_PER_INSTALLATION:-2}
      REFLEX_CLOUD_FREE_IP_REQUESTS_PER_HOUR: ${REFLEX_CLOUD_FREE_IP_REQUESTS_PER_HOUR:-60}
      REFLEX_CLOUD_GLOBAL_DAILY_REQUEST_LIMIT: ${REFLEX_CLOUD_GLOBAL_DAILY_REQUEST_LIMIT:?set REFLEX_CLOUD_GLOBAL_DAILY_REQUEST_LIMIT}
      REFLEX_CLOUD_GLOBAL_DAILY_COST_BUDGET_MICROUSD: ${REFLEX_CLOUD_GLOBAL_DAILY_COST_BUDGET_MICROUSD:?set REFLEX_CLOUD_GLOBAL_DAILY_COST_BUDGET_MICROUSD}
      REFLEX_CLOUD_BUDGET_MAX_OUTPUT_CHARS_PER_REQUEST: ${REFLEX_CLOUD_BUDGET_MAX_OUTPUT_CHARS_PER_REQUEST:-200000}
      REFLEX_CLOUD_BUDGET_RESERVATION_TTL_SECONDS: ${REFLEX_CLOUD_BUDGET_RESERVATION_TTL_SECONDS:-600}
      REFLEX_CLOUD_RETENTION_CLEANUP_INTERVAL_SECONDS: ${REFLEX_CLOUD_RETENTION_CLEANUP_INTERVAL_SECONDS:-86400}
    ports:
      - "${REFLEX_CLOUD_BIND_ADDRESS:-127.0.0.1}:${REFLEX_CLOUD_PORT:-8787}:8787"
    volumes:
      - reflex-cloud-uploads:/app/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    profiles: ["public"]
    restart: unless-stopped
    environment:
      REFLEX_CLOUD_DOMAIN: ${REFLEX_CLOUD_DOMAIN:-cloud.example.com}
    ports:
      - "${REFLEX_CLOUD_HTTP_PORT:-80}:80"
      - "${REFLEX_CLOUD_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - reflex-cloud-caddy-data:/data
      - reflex-cloud-caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

volumes:
  reflex-cloud-postgres:
  reflex-cloud-uploads:
  reflex-cloud-caddy-data:
  reflex-cloud-caddy-config:
