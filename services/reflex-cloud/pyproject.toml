[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-cloud"
version = "0.1.0"
description = "Cloud feedback, quota, and optimization service for Reflex Next."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "reflex-core",
  "reflex-provider-minimax",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8,<9",
]

[project.scripts]
reflex-cloud = "reflex_cloud.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reflex_cloud = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
reflex-core = { path = "../../packages/reflex-core", editable = true }
reflex-provider-minimax = { path = "../../plugins/provider-minimax", editable = true }
