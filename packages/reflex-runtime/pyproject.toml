[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-runtime"
version = "0.1.0"
description = "Runtime sidecar for Reflex Next host integration."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
builtins = [
  "reflex-history-sqlite",
  "reflex-batch-runner",
  "reflex-markdown-preview",
  "reflex-plugin-semantic-detector",
  "reflex-translator",
  "reflex-provider-minimax",
  "reflex-provider-openai-compatible",
]
dev = [
  "pyinstaller>=6,<7",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../reflex-core/src"]

[tool.uv.sources]
reflex-history-sqlite = { path = "../../plugins/history-sqlite", editable = true }
reflex-batch-runner = { path = "../../plugins/batch-runner", editable = true }
reflex-markdown-preview = { path = "../../plugins/markdown-preview", editable = true }
reflex-plugin-semantic-detector = { path = "../../plugins/semantic-detector", editable = true }
reflex-translator = { path = "../../plugins/translator", editable = true }
reflex-provider-minimax = { path = "../../plugins/provider-minimax", editable = true }
reflex-provider-openai-compatible = { path = "../../plugins/provider-openai-compatible", editable = true }
