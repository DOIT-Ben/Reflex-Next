[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-runtime"
version = "0.1.0"
description = "Runtime sidecar for Reflex Next host integration."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../reflex-core/src"]
